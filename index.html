<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>우리 둘의 꽃집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4A3F5C; --ink2:#7A6F8C; --paper:#FFFDF9; --bg:#E3EFE6; --pink:#EE8FA7; --pinkD:#D8708C; --pinkL:#FBDDE4;
  --yellow:#F5CF4E; --sky:#BFD9F2; --leaf:#7FA86A; --line:rgba(74,63,92,.2); --sm:#3E6FC2; --sk:#E0708C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#2F3A36; } }
:root[data-theme="dark"]{ --bg:#2F3A36; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas#game{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
button{font:inherit;color:inherit}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;line-height:1.2;
  box-shadow:0 2px 0 rgba(74,63,92,.28);cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(74,63,92,.28)}
.btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--pinkD)}
.btn.soft{background:var(--pinkL)}
.btn.small{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) calc(8px + env(safe-area-inset-right,0px)) 0 calc(8px + env(safe-area-inset-left,0px));
  display:none;align-items:center;gap:8px;z-index:20;pointer-events:none}
#hud > *{pointer-events:auto}
.pill{background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 rgba(74,63,92,.18)}
#hOrders{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
#hOrders::-webkit-scrollbar{display:none}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12px;white-space:nowrap}
.chip b{font-weight:normal;color:var(--ink2);margin-right:4px}
.chip.late{border-color:var(--pink)}
.chip.done{opacity:.45}
.chip.here{border-color:var(--ink);background:var(--pinkL)}
#hRight{display:flex;gap:6px}

/* controls */
#controls{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:15;display:none}
#controls > *{pointer-events:auto}
.joyzone{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom,0px));width:170px;height:170px;touch-action:none}
.joyzone.left{left:calc(4px + env(safe-area-inset-left,0px))}
.joyzone.right{right:calc(4px + env(safe-area-inset-right,0px))}
.base{position:absolute;left:30px;top:30px;width:110px;height:110px;border-radius:50%;background:rgba(255,253,249,.42);border:2px solid rgba(74,63,92,.35)}
.knob{position:absolute;left:30px;top:30px;width:46px;height:46px;border-radius:50%;background:rgba(255,253,249,.92);border:2px solid var(--ink);transition:transform .05s}
.act{position:fixed;width:86px;height:86px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,253,249,.92);font-size:14px;
  box-shadow:0 3px 0 rgba(74,63,92,.3);touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;line-height:1.15;word-break:keep-all}
.act.ready{background:var(--pinkL)}
.act.p0{border-color:var(--sm)} .act.p1{border-color:var(--sk)}
.act.pos-right{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.act.pos-li{left:calc(180px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:74px;height:74px;font-size:12px}
.act.pos-ri{right:calc(180px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:74px;height:74px;font-size:12px}
.swap{position:fixed;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));font-size:12px}
.hide{display:none!important}

/* modals */
.modal{position:fixed;top:calc(50px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;display:none;
  background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(74,63,92,.18);overflow:auto;padding:12px 14px}
.modal.open{display:flex;flex-direction:column;overflow:hidden}
.modal.center{left:50%;transform:translateX(-50%);width:min(700px,94vw)}
.modal.left{left:calc(8px + env(safe-area-inset-left,0px));width:calc(50vw - 14px)}
.modal.right{right:calc(8px + env(safe-area-inset-right,0px));width:calc(50vw - 14px)}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mh h2{font-size:17px;font-weight:normal;margin:0;flex:1}
.who{font-size:11px;border-radius:999px;padding:2px 8px;color:#fff}
.who.p0{background:var(--sm)} .who.p1{background:var(--sk)}
.mg{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:12px;align-items:start}
.preview{background:linear-gradient(#FDF6F1,#F7EDE6);border:1.5px solid var(--line);border-radius:14px;padding:4px;aspect-ratio:200/236;width:100%}
.preview svg{width:100%;height:100%;display:block}
.req{font-size:13px;line-height:1.55;margin:4px 0 8px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.check{font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.check span.ok{color:#4F8A3E}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.lbl{font-size:12px;color:var(--ink2);margin-top:8px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px}
.li .t{color:var(--ink2);min-width:64px}
.li .grow{flex:1}
.fresh{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
.stage svg{width:min(220px,100%);height:auto;touch-action:none}
.cutwrap{display:flex;align-items:center;justify-content:center;gap:16px}
.cutsvg{flex:1;max-width:240px;cursor:pointer}
.cutsvg svg{width:100%;height:auto;display:block}
.cutbtn{width:92px;height:92px;border-radius:50%;font-size:16px;flex:none}
.chip{cursor:pointer}
#orderPop{position:fixed;top:calc(50px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,92vw);z-index:45;display:none;background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(74,63,92,.18);padding:12px 14px}
#orderPop.open{display:block}
.note{font-size:12px;color:var(--ink2);text-align:center}
.big{font-size:15px}

/* toasts */
#toasts{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;z-index:40;pointer-events:none}
.toast{position:absolute;background:var(--ink);color:#fff;border-radius:12px;padding:7px 12px;font-size:13px;max-width:44vw;opacity:0;transition:opacity .2s,transform .2s;transform:translateY(-4px)}
.toast.show{opacity:1;transform:none}
.toast.t0{left:calc(12px + env(safe-area-inset-left,0px))}
.toast.t1{right:calc(12px + env(safe-area-inset-right,0px))}
.toast.tc{left:50%;transform:translateX(-50%)}
.toast.tc.show{transform:translateX(-50%)}

/* screens */
#screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(227,239,230,.86);padding:16px;overflow:auto}
#screen.hidden{display:none}
.sheet{background:var(--paper);border:1.5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 rgba(74,63,92,.16);padding:18px 22px;width:min(760px,96vw);max-height:92vh;overflow:auto}
.title-wrap{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.title-art{width:150px}
.title-art svg{width:100%;height:auto;display:block}
h1{font-size:34px;font-weight:normal;margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px;line-height:1.5}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.hint{font-size:12px;color:var(--ink2);line-height:1.6}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gallery{display:flex;gap:8px;flex-wrap:wrap}
.gallery figure{margin:0;width:92px;text-align:center;font-size:11px;color:var(--ink2)}
.gallery svg{width:92px;height:auto;background:#FBF3EE;border-radius:10px;border:1px solid var(--line)}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.stat.total{font-size:16px;border-bottom:none}
.stars{color:#E6A23C;letter-spacing:1px}
#rotate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;font-size:16px;padding:20px;line-height:1.7}
@media (orientation: portrait){ #rotate{display:flex} }
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin:4px 0 8px}
.cell{position:relative;aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:linear-gradient(#FFFDF9,#F7EFE8);padding:2px;cursor:pointer;overflow:hidden;font:inherit;color:inherit}
.cell.empty{background:repeating-linear-gradient(45deg,#FBF6F1,#FBF6F1 5px,#F5EDE6 5px,#F5EDE6 10px);cursor:default}
.cell svg{width:100%;height:100%;display:block;pointer-events:none}
.cell.dried svg{filter:sepia(.75) saturate(.7)}
.cell.dim{opacity:.4}
.cell.sel{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset,0 0 0 1px var(--ink)}
.cell .cnt{position:absolute;right:4px;bottom:3px;font-size:11px;background:rgba(255,255,255,.9);border-radius:8px;padding:0 4px;line-height:15px}
.cell .dot{position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;border:1px solid #fff}
.cell .tag{position:absolute;left:3px;bottom:3px;font-size:10px;background:rgba(74,63,92,.78);color:#fff;border-radius:7px;padding:0 4px;line-height:14px}
.cell .bar{position:absolute;left:6px;right:6px;top:4px;height:4px;border-radius:3px;background:rgba(0,0,0,.08)}
.cell .bar b{display:block;height:100%;border-radius:3px;background:#7FB8E6}
.namein{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:#4A3F5C}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.inv .grid{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}
.modal{touch-action:none;overscroll-behavior:contain}
.fq{display:inline-flex;align-items:center;gap:1px;margin-left:3px;font-size:12px}
.fm{width:15px;height:15px;display:inline-block;vertical-align:middle}
.chip .hereDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E0708C;margin-left:4px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.cell .ptag{position:absolute;right:3px;top:3px;font-size:10px;background:#FFF1C4;border-radius:7px;padding:0 4px;line-height:14px}
.tabs .btn{padding:6px 10px}
.inv{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)!important}
.invL{position:sticky;top:0;align-self:start;background:var(--paper);z-index:2;padding-bottom:4px}
.modal.talk{top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;height:auto!important;max-height:none!important;padding:10px 12px}
.talkline{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.45}
.talkline small{color:#8A7F96}
.mbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.mbody.noscroll{overflow:hidden;display:flex;flex-direction:column}
.mbody.noscroll>.inv{flex:1;min-height:0}
.mbody.noscroll>:not(.inv){flex:none}
.inv{display:grid;min-height:0;height:100%}
.invL,.invR{position:static!important;overflow-y:auto;overflow-x:hidden;min-height:0;height:100%;padding-right:2px}
.modal.talk .mbody{overflow:visible}
.gfocus{outline:3px solid #E0708C!important;outline-offset:2px}
#tut{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:25;background:#FFFDF6;border:1.5px solid var(--ink);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:min(640px,92vw);box-shadow:0 4px 0 rgba(74,63,92,.14)}
#tut b{color:#C65C79;font-weight:normal}
.setrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.setrow .grow{flex:1}
.meter{display:inline-block;width:110px;height:10px;border-radius:6px;background:#EFE6DE;overflow:hidden;vertical-align:middle}
.meter b{display:block;height:100%;background:#E0708C}
@supports not (aspect-ratio:1/1){.cell{height:56px}.preview{height:200px}}
.oldflex .row>*,.oldflex .opts>*,.oldflex .mh>*{margin-right:6px;margin-bottom:6px}
#tip{position:fixed;z-index:60;pointer-events:none;background:#4A3F5C;color:#fff;font-size:14px;padding:6px 10px;border-radius:10px;opacity:0;transition:opacity .12s;max-width:280px;left:-999px;top:-999px}
#tip.on{opacity:1}
.cell.wilted svg{filter:grayscale(.6) sepia(.4)}
.chip{display:inline-flex!important;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 10px!important;min-width:78px;vertical-align:top}
.chip .ct{font-size:13px;display:flex;align-items:center;gap:3px}
.chip .fr{display:flex;align-items:center;gap:4px;font-size:15px;line-height:1}
.chip .fr b{font-weight:normal}
.chip .fm{width:22px;height:22px}
.chip.urgent{border-color:#E0708C!important;background:#FFF0F3!important}
.chip .tbar{display:block;width:100%;height:5px;border-radius:3px;background:#F3D3DA;margin-top:3px;overflow:hidden}
.chip .tbar i{display:block;height:100%;background:#E0708C}
.fq .fm{width:20px;height:20px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shopgrid.img{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.scard{border:1.5px solid var(--line);border-radius:14px;padding:8px;background:#FFFDF9;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:inherit;color:inherit}
.scard.own{opacity:.75}
.sart{width:72px;height:72px}
.sart svg{width:100%;height:100%}
.sname{font-size:14px}
.sdesc{font-size:12px;color:#8A7F96;line-height:1.35}
.sbad{font-size:12px;color:#7FA86A}
.stylepick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.stylepick .scard{cursor:pointer}
.stylepick .sart{width:120px;height:120px}
.confirm{display:flex;align-items:center;gap:10px;padding:10px;margin:0 0 10px;border:2px solid #E0708C;border-radius:14px;background:#FFF5F7}
.confirm .sart{width:56px;height:56px;flex:none}
.spart{font-size:12px;color:#8A7F96;background:#F3EEE8;border-radius:8px;padding:1px 7px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span class="pill hide" id="hDay">1일차</span>
  <span class="pill hide" id="hMoney">0원</span>
  <div id="hOrders"></div>
  <div id="hRight">
    <button class="btn small hide" id="bClose">영업 마감</button>
    <button class="btn small hide" id="bEdit">가구 배치</button>
    <button class="btn small" id="bSpeed">1배속</button>
    <button class="btn small" id="bPause">메뉴</button>
  </div>
</div>

<div id="controls"></div>
<div class="modal" id="modal0"></div>
<div class="modal" id="modal1"></div>
<div id="toasts"></div>
<div id="orderPop" role="dialog" aria-label="예약 정보"></div>
<div id="tut" class="hide"></div>
<div id="tip" role="status"></div>
<div id="screen"></div>
<div id="rotate">휴대폰을 가로로 돌려 주세요<br><small>가로 화면에서 플레이할 수 있어요</small></div>

<script>"use strict";
const TILE = 16, VW = 288, VH = 176;
const DAY_LEN = 600, REAL_PER_MIN = 1.5, MARKET_CLOSE = 180, CLOSE_OK = 540;
const HYDRATE_MIN = 30, DRY_MIN = 60, WILT = 15, REST_MIN = 5, BOOST_MIN = 60;
const SAVE_KEY = "ourflowershop_save_v1";
const AREAS = { shop: { h: 11 }, market: { w: 22, h: 11 }, supply: { w: 14, h: 10 }, town: { w: 58, h: 34 }, north: { w: 58, h: 22 } };
function shopLevel() {
  return S.up.exp3 ? 3 : S.up.exp2 ? 2 : S.up.exp1 ? 1 : 0;
}
Object.defineProperty(AREAS.shop, "w", { get: () => 18 + 4 * shopLevel() });
const GROW = { tulip: 3, freesia: 3, gyp: 2, rose: 4, hydrangea: 4 };
const SEED_PRICE = { tulip: 4e3, freesia: 3500, gyp: 2500, rose: 6e3, hydrangea: 5e3 };
const RIVER = [27, 33];
function walkCol(tx) {
  return tx >= 24 && tx <= 26 || tx >= 34 && tx <= 36;
}
function bridgeRow(ty) {
  return ty >= 6 && ty <= 12 || ty >= 17 && ty <= 18 || ty >= 24 && ty <= 25;
}
const FL = {
  tulip: { name: "\uD2A4\uB9BD", decay: 5, price: 9e3, dot: "#EE8FA7" },
  freesia: { name: "\uD504\uB9AC\uC9C0\uC544", decay: 4, price: 7500, dot: "#F5CF4E" },
  gyp: { name: "\uC548\uAC1C\uAF43", decay: 3, price: 5e3, dot: "#FFFFFF" },
  rose: { name: "\uC7A5\uBBF8", decay: 3.5, price: 15e3, dot: "#D9435E" },
  hydrangea: { name: "\uC218\uAD6D", decay: 6, price: 12e3, dot: "#9DB8E8" }
};
const TYPES = ["tulip", "freesia", "gyp", "rose", "hydrangea"];
const LEAVES = { tulip: 3, freesia: 2, gyp: 4, rose: 3, hydrangea: 2 };
const PAPERS = {
  pink: { name: "\uBD84\uD64D", c: "#F4B6C4", d: "#E08FA4", l: "#FBDDE4" },
  yellow: { name: "\uB178\uB791", c: "#F6DC86", d: "#E2BD55", l: "#FBEFC3" },
  cream: { name: "\uD06C\uB9BC", c: "#EFE4D2", d: "#D5C3A8", l: "#FAF4EA" },
  sky: { name: "\uD558\uB298", c: "#B9D6F0", d: "#8DB6DE", l: "#DDEBF8" },
  lilac: { name: "\uB77C\uC77C\uB77D", c: "#D6C6EC", d: "#B5A0DA", l: "#EAE1F6" },
  mint: { name: "\uBBFC\uD2B8", c: "#BFE3D0", d: "#94C9AE", l: "#E1F3EA", extra: true },
  coral: { name: "\uCF54\uB784", c: "#F6B7A0", d: "#E3927A", l: "#FBDCD0", extra: true },
  kraft: { name: "\uD06C\uB77C\uD504\uD2B8", c: "#D8B994", d: "#B8956C", l: "#EBD8C0", extra: true }
};
const RIBBONS = {
  white: { name: "\uD770\uC0C9", c: "#FFFFFF", d: "#D6D0C6" },
  pink: { name: "\uBD84\uD64D", c: "#EE7F9C", d: "#C65C79" },
  navy: { name: "\uB0A8\uC0C9", c: "#3A4C80", d: "#243059" },
  gold: { name: "\uAE08\uC0C9", c: "#E1B656", d: "#B48C33" },
  lavender: { name: "\uB77C\uBCA4\uB354", c: "#B9A2E0", d: "#8E76C0", extra: true },
  green: { name: "\uCD08\uB85D", c: "#7FB070", d: "#5C8C50", extra: true }
